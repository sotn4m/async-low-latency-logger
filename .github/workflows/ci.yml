name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build -j
      - name: Run demo
        run: ./build/async_low_latency_logger
      - name: Run benchmark harness (skeleton)
        run: ./build/bench_logger
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  test-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ThreadSanitizer)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DALLL_ENABLE_TSAN=ON -DALLL_BUILD_BENCHMARKS=OFF -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build-tsan -j
      - name: Run tests under ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure

# Note: this CI only builds/smoke-tests/unit-tests. Real benchmark numbers
# require the OS-tuned bare-metal box described in the README (CPU
# isolation, IRQ affinity, pinned governor) — CI runners can't reproduce
# that environment, so latency numbers are collected and committed
# manually.
